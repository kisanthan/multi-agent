name: Cross-platform verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Check base environment
        run: python scripts/check_environment.py --mode setup

      - name: Validate shell scripts
        if: runner.os != 'Windows'
        run: bash -n scripts/setup.sh scripts/start.sh

      - name: Validate PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = @()
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/setup.ps1"), [ref]$null, [ref]$errors
          ) | Out-Null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts/start.ps1"), [ref]$null, [ref]$errors
          ) | Out-Null
          if ($errors.Count) {
            $errors | Format-List
            exit 1
          }

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q
